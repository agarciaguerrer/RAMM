# Configuración de la base de datos (valores por defecto).
#
# Para usar tu propia contraseña sin modificar este fichero, crea al lado de donde ejecutas el programa
# un fichero "bd.local.properties" con las claves que quieras cambiar, por ejemplo:
#     bd.password=mi_contraseña
# (bd.local.properties está en .gitignore, así que no se sube al repositorio).

# Motor de base de datos. De momento solo MYSQL; ver hoteles.modelo.dao.DAOFactory.
bd.tipo=MYSQL

# La base de datos "RAMM_hoteles" se crea con sql/hoteles.sql
bd.url=jdbc:mysql://localhost:3306/RAMM_hoteles?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
bd.usuario=root
bd.password=
